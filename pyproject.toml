[tool.poetry]
name = "flightscope"
version = "0.1.0"
description = "Interactive flight simulator/real time inspector app"
authors = ["Nazenano", "Fakas"]
readme = "README.md"
homepage = "https://github.com/Nazenano/flightscope"

[tool.poetry.dependencies]
python = ">=3.12,<4.0.0"
numpy = "^2.3.3"
ursina = "^8.2.0"
requests = "^2.32.5"
python-dotenv = "^1.2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
